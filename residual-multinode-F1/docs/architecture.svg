<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Residual-aware multi-node KinD demonstrator</title>
  <desc id="desc">One GC master on the control-plane coordinates three UPF residual simulators and GC agents, one on each worker node.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="40" y="30" width="1120" height="690" rx="18" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="600" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700">Four-node KinD cluster</text>

  <rect x="350" y="105" width="500" height="180" rx="14" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
  <text x="600" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700">Control-plane</text>
  <rect x="430" y="165" width="340" height="85" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="600" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700">gc-master</text>
  <text x="600" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">RAI, TTC, horizon projection, HOLD/GC</text>

  <line x1="600" y1="250" x2="600" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="305" font-family="Arial, sans-serif" font-size="14">HTTP telemetry and decisions</text>

  <g font-family="Arial, sans-serif">
    <rect x="80" y="370" width="300" height="285" rx="14" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
    <text x="230" y="405" text-anchor="middle" font-size="20" font-weight="700">Worker 1</text>
    <rect x="115" y="440" width="230" height="150" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
    <text x="230" y="475" text-anchor="middle" font-size="18" font-weight="700">gc-agent-upf</text>
    <text x="230" y="510" text-anchor="middle" font-size="17">UPF-1</text>
    <text x="230" y="540" text-anchor="middle" font-size="15">steady profile</text>
    <text x="230" y="568" text-anchor="middle" font-size="15">local cleanup execution</text>

    <rect x="450" y="370" width="300" height="285" rx="14" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
    <text x="600" y="405" text-anchor="middle" font-size="20" font-weight="700">Worker 2</text>
    <rect x="485" y="440" width="230" height="150" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
    <text x="600" y="475" text-anchor="middle" font-size="18" font-weight="700">gc-agent-upf</text>
    <text x="600" y="510" text-anchor="middle" font-size="17">UPF-2</text>
    <text x="600" y="540" text-anchor="middle" font-size="15">bursty profile</text>
    <text x="600" y="568" text-anchor="middle" font-size="15">local cleanup execution</text>

    <rect x="820" y="370" width="300" height="285" rx="14" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
    <text x="970" y="405" text-anchor="middle" font-size="20" font-weight="700">Worker 3</text>
    <rect x="855" y="440" width="230" height="150" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
    <text x="970" y="475" text-anchor="middle" font-size="18" font-weight="700">gc-agent-upf</text>
    <text x="970" y="510" text-anchor="middle" font-size="17">UPF-3</text>
    <text x="970" y="540" text-anchor="middle" font-size="15">high-load profile</text>
    <text x="970" y="568" text-anchor="middle" font-size="15">local cleanup execution</text>
  </g>

  <line x1="600" y1="330" x2="230" y2="440" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="330" x2="600" y2="440" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="330" x2="970" y2="440" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="600" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">Scenarios: UPF-noGC and UPF-withGC</text>
</svg>
