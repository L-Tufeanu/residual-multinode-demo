apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gc-agent-upf
  namespace: residual-demo
spec:
  selector:
    matchLabels:
      app: gc-agent-upf
  template:
    metadata:
      labels:
        app: gc-agent-upf
    spec:
      nodeSelector:
        residual-demo/worker: "true"
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: residual-multinode-demo:1.2
          imagePullPolicy: IfNotPresent
          args: ["/app/agent.py"]
          envFrom:
            - configMapRef:
                name: residual-demo-parameters
          env:
            - name: MASTER_URL
              value: "http://gc-master:8080/v1/telemetry"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SCENARIO
              value: "__SCENARIO__"
            - name: RUN_ID
              value: "__RUN_ID__"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
