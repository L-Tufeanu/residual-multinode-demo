apiVersion: apps/v1
kind: Deployment
metadata:
  name: gc-master
  namespace: residual-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gc-master
  template:
    metadata:
      labels:
        app: gc-master
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: master
          image: residual-multinode-demo:1.2
          imagePullPolicy: IfNotPresent
          args: ["/app/controller.py"]
          envFrom:
            - configMapRef:
                name: residual-demo-parameters
          env:
            - name: SCENARIO
              value: "__SCENARIO__"
            - name: RUN_ID
              value: "__RUN_ID__"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: gc-master
  namespace: residual-demo
spec:
  selector:
    app: gc-master
  ports:
    - name: http
      port: 8080
      targetPort: http
